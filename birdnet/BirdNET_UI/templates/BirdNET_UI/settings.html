{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon">
    <link rel="stylesheet" href="{% static 'styles.css' %}">
    <script src="{% static 'js/config.js' %}"></script>
</head>
<body>
    <div class="config-button-container">
        <h1 style="display: inline;">Settings</h1>
        <button id="save-settings-button" type="submit">Save Changes</button>
        <a href="/" class="home-button">Home</a>
    </div>

    <div class="config-form-container">
        <form id="config-form" class="config-form" method="POST" action="{% url 'update_birds_config' %}">
            {% csrf_token %}
            <div class="config-section">
                <h2>Bird Detection Settings</h2>
                <div class="config-row">
                    <label for="confidence_threshold">Confidence Threshold:</label>
                    <input type="text" id="confidence_threshold" name="confidence_threshold" value="{{ confidence_threshold }}" required>
                </div>
                <div class="config-row">
                    <label for="confidence_threshold_for_add_to_db">Confidence Threshold for Add to Database:</label>
                    <input type="text" id="confidence_threshold_for_add_to_db" name="confidence_threshold_for_add_to_db" value="{{ confidence_threshold_for_add_to_db }}" required>
                </div>
                <div class="config-row">
                    <label for="history_days">History Days:</label>
                    <input type="text" id="history_days" name="history_days" value="{{ history_days }}" required>
                </div>
                <div class="config-row">
                    <label for="max_frequency">Max Frequency (Hz):</label>
                    <input type="text" id="max_frequency" name="max_frequency" value="{{ max_frequency }}" required>
                </div>
                <div class="config-row">
                    <label for="latitude">Latitude:</label>
                    <input type="text" id="latitude" name="latitude" value="{{ latitude }}" required>
                </div>
                <div class="config-row">
                    <label for="longitude">Longitude:</label>
                    <input type="text" id="longitude" name="longitude" value="{{ longitude }}" required>
                </div>
                <div class="config-row">
                    <label for="state">State:</label>
                    <input type="text" id="state" name="state" value="{{ state }}" required>
                </div>
                <div class="config-row">
                    <label for="subregion_code">Subregion Code:</label>
                    <input type="text" id="subregion_code" name="subregion_code" value="{{ subregion_code }}" required>
                </div>
            </div>
        </form>
    </div>

    <div class="config-commands">
        <h2>Commands</h2>
        <a href="#" title="Resets local rarity of birds in region. Takes a couple minutes to complete." class="command-ebirds-compile-button" onclick="promptForPassword_for_compile_ebirds(event)">
            Compile eBirds
        </a>

        <a href="#" title="Tries to get audio and map data for birds." class="command-ebirds-extras-compile-button" onclick="promptForPassword_for_compile_ebirds_extras(event)">
            Compile eBirds Extras
        </a>

        <a href="{% url 'download_database' %}" title="Download the raw birds.db database file (recommended to open with python)" id="download-birds-database-button">
            <img class="card-collection-image" src="{% static 'img/database_icon.png' %}">
            Download Birds Database
        </a>

        <a href="{% url 'download_database_ebirds' %}" title="Download the raw ebirds.db database file" id="download-ebirds-database-button">
            <img class="card-collection-image" src="{% static 'img/database_icon.png' %}">
            Download eBirds Database
        </a>

        <a href="{% url 'download_python_scripts' %}" title="Download the python scripts for processing databases" id="download-python-scripts-button">
            <img class="card-collection-image" src="{% static 'img/database_icon.png' %}">
            Download Python Scripts
        </a>
    </div>

</body>
</html>
